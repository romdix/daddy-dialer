# One-command stack for local testing or a plain Docker host.
# On Coolify you can deploy this as a Docker Compose resource instead.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: daddy_dialer
      POSTGRES_USER: dd
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - dd-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dd -d daddy_dialer']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dd:${DB_PASSWORD:-change-me}@db:5432/daddy_dialer
      APP_SECRET: ${APP_SECRET:-please-change-this}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      PORT: 8080
      NODE_ENV: production
    ports:
      - '8080:8080'

volumes:
  dd-db:
